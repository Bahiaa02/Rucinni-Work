<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;color:#e0e0e0;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#222}

.navbar{position:fixed;top:0;left:0;right:0;z-index:9999;height:58px;background:rgba(0,0,0,0.92);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 20px;gap:14px}
.nb-ham{flex-shrink:0;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.nb-ham span{display:block;width:20px;height:1.5px;background:#ccc;border-radius:2px}
.nb-logo{flex-shrink:0;display:flex;align-items:center;text-decoration:none;background:none;border:none;padding:0}
.nb-logo img{width:34px;height:34px;object-fit:contain;display:block}
.nb-gap{flex:1}
.nb-auth{display:flex;align-items:center;flex-shrink:0}
.nb-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-size:.8rem;white-space:nowrap;padding:8px 12px;transition:color .2s;text-decoration:none;display:inline-block}
.nb-btn:hover{color:#fff}
.nb-sep{color:rgba(255,255,255,0.15);font-size:.8rem}
.nb-cart{flex-shrink:0;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.7);padding:8px 6px 8px 10px;transition:color .2s;display:flex;align-items:center;position:relative}
.nb-cart:hover{color:#fff}
.nb-badge{position:absolute;top:2px;right:0;background:#fff;color:#000;font-size:.55rem;font-weight:700;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 2px}

.drw-overlay{display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.5)}
.drawer{position:fixed;top:58px;left:0;bottom:0;width:240px;z-index:9999;background:#080808;border-right:1px solid rgba(255,255,255,0.06);padding:1.8rem 1.5rem;transform:translateX(-100%);transition:transform .28s ease}
.drawer.open{transform:translateX(0)}
.drw-link{display:block;border:none;border-bottom:1px solid rgba(255,255,255,0.05);padding:13px 0;cursor:pointer;text-decoration:none;font-family:'Cinzel',serif;font-size:.67rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.4);transition:color .2s;background:none;width:100%;text-align:left}
.drw-link:hover{color:rgba(255,255,255,.85)}

.hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 80%,rgba(0,0,0,.95) 100%);z-index:1;pointer-events:none}
.hw{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:520px;padding:0 20px}
.h-logo{width:clamp(180px,42vw,400px);height:auto;display:block;margin-bottom:14px;filter:drop-shadow(0 2px 16px rgba(0,0,0,1))}
.h-diamonds{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.h-diamonds i{display:block;width:6px;height:6px;background:rgba(255,255,255,.7);transform:rotate(45deg)}
.h-diamonds i:nth-child(2){width:4px;height:4px;background:rgba(255,255,255,.35)}
.h-tabs{display:flex;align-items:center;gap:28px;margin-bottom:22px}
.h-tab{background:none;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:3.5px;text-transform:uppercase;color:rgba(255,255,255,.85);padding:4px 0;text-decoration:none;display:inline-block;transition:color .2s;text-shadow:0 1px 8px rgba(0,0,0,1)}
.h-tab:hover{color:#fff}
.h-search{display:flex;align-items:center;width:100%;max-width:360px;border:1px solid rgba(255,255,255,.2);border-radius:100px;background:rgba(0,0,0,.55);overflow:hidden;backdrop-filter:blur(4px)}
.h-search svg{margin-left:15px;flex-shrink:0;opacity:.4}
.h-search input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:'Inter',sans-serif;font-size:.82rem;padding:11px 13px}
.h-search input::placeholder{color:rgba(255,255,255,.28)}
.h-sbtn{flex-shrink:0;background:#fff;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#000;padding:9px 18px;margin:5px;border-radius:100px;transition:background .2s;white-space:nowrap}
.h-sbtn:hover{background:#e0e0e0}

.ovl{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
.ovl.on{opacity:1;pointer-events:all}
.mod{background:#0a0a0a;border:1px solid rgba(255,255,255,.1);width:100%;max-width:460px;padding:2.2rem;position:relative;transform:translateY(14px);transition:transform .25s}
.ovl.on .mod{transform:translateY(0)}
.mod-x{position:absolute;top:.9rem;right:1rem;background:none;border:none;color:#555;font-size:.95rem;cursor:pointer}
.mod-x:hover{color:#fff}
.mod-t{font-family:'Cinzel',serif;font-size:1rem;font-weight:600;margin-bottom:3px}
.mod-s{font-size:.7rem;color:#555;margin-bottom:1.6rem}
.atabs{display:flex;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:1.6rem}
.atab{flex:1;background:none;border:none;padding:10px;font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:2px;text-transform:uppercase;color:#555;cursor:pointer;transition:color .2s;border-bottom:1px solid transparent;margin-bottom:-1px}
.atab.on{color:#c4a35a;border-bottom-color:#c4a35a}
.aform{display:flex;flex-direction:column;gap:9px}
.aform input{background:#111;border:1px solid rgba(255,255,255,.07);color:#e0e0e0;padding:10px 13px;font-family:'Inter',sans-serif;font-size:.81rem;outline:none;transition:border-color .2s}
.aform input:focus{border-color:#c4a35a}
.aform input::placeholder{color:#444}
.asw{text-align:center;font-size:.7rem;color:#555;margin-top:8px}
.asw a{color:#c4a35a;cursor:pointer}
.gbtn{width:100%;background:#c4a35a;border:none;color:#000;padding:12px;font-family:'Cinzel',serif;font-size:.67rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.gbtn:hover{background:#d9bb7a}
.obtn{background:none;border:1px solid #c4a35a;color:#c4a35a;padding:7px 22px;font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.obtn:hover{background:#c4a35a;color:#000}

.chat-wrap{position:fixed;bottom:24px;right:24px;z-index:8000}
.chat-tog{width:52px;height:52px;border-radius:50%;background:#0d0d0d;border:1px solid rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.6);position:relative}
.chat-dot{position:absolute;top:1px;right:1px;width:9px;height:9px;background:#c4a35a;border-radius:50%}
.chat-win{position:absolute;bottom:62px;right:0;width:290px;background:#0a0a0a;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.93) translateY(6px);transform-origin:bottom right;transition:all .22s}
.chat-win.on{opacity:1;pointer-events:all;transform:scale(1) translateY(0)}
.cwhead{padding:.85rem 1rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.cwav{width:32px;height:32px;flex-shrink:0;border:1px solid rgba(196,163,90,.3);padding:3px;background:#000;display:flex;align-items:center;justify-content:center}
.cwav img{width:100%;height:100%;object-fit:contain;display:block}
.cwinfo p{font-size:.77rem;font-weight:500}.cwinfo span{font-size:.6rem;color:#c4a35a}
.cwmsgs{flex:1;padding:.85rem;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:210px;min-height:170px}
.cm{max-width:88%;padding:7px 10px;font-size:.74rem;line-height:1.5}
.cm.bot{background:#111;align-self:flex-start;border-left:2px solid #c4a35a}
.cm.usr{background:rgba(196,163,90,.07);align-self:flex-end;border-right:2px solid #c4a35a}
.cwin{display:flex;border-top:1px solid rgba(255,255,255,.06)}
.cwin input{flex:1;background:none;border:none;outline:none;color:#ccc;padding:10px;font-family:'Inter',sans-serif;font-size:.74rem}
.cwin input::placeholder{color:#444}
.cwsnd{background:none;border:none;border-left:1px solid rgba(255,255,255,.06);color:#c4a35a;cursor:pointer;padding:0 13px;font-size:.95rem}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0d0d0d;border:1px solid #c4a35a;color:#e0e0e0;padding:8px 20px;font-size:.76rem;z-index:20000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>

      <input type="text" placeholder="Sua dúvida..." id="cinput" onkeydown="if(event.key==='Enter')sendMsg()">

    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span class="chat-dot"></span>

<div class="toast" id="toastEl"></div>

<script>
// ── Supabase ──────────────────────────────────────────────
const { createClient } = supabase;
const sb = createClient("https://dbccnfjtgrrnuqudcxyj.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiY2NuZmp0Z3JybnVxdWRjeHlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzUyNDEsImV4cCI6MjA5NDQ1MTI0MX0.13MV09Jp-YMGXx7gZHp9oNgY8U3SFDj_8kEPQaLocdw");
let currentUser = null;
let cart = JSON.parse(localStorage.getItem("rucart") || "[]");

// ── Auth ──────────────────────────────────────────────────
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) currentUser = session.user;
  updateNav();
  sb.auth.onAuthStateChange(function(_e, s) {
    currentUser = s && s.user ? s.user : null;
    updateNav();
  });
}

function updateNav() {
  const nav = document.getElementById("navAuth");
  if (!nav) return;
  const b = document.getElementById("badge");
  if (b) b.textContent = cart.length;
  if (currentUser) {
    const name = (currentUser.user_metadata && currentUser.user_metadata.name)
      ? currentUser.user_metadata.name
      : currentUser.email.split("@")[0];
    nav.innerHTML = "<a href='cliente.html' class='nb-btn' style='color:#c4a35a'>Olá, " + name + "</a>"
      + "<span class='nb-sep'>|</span>"
      + "<button class='nb-btn' onclick='logout()'>Sair</button>";
  } else {
    nav.innerHTML = "<button class='nb-btn' onclick='openAuth("signup")'>Criar Conta</button>"
      + "<span class='nb-sep'>|</span>"
      + "<button class='nb-btn' onclick='openAuth("login")'>Entrar</button>";
  }
}

async function logout() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  updateNav();
  toast("Até logo!");
}

// ── Drawer ────────────────────────────────────────────────
function toggleDrw() {
  const d = document.getElementById("drw");
  const o = document.getElementById("drwOverlay");
  d.classList.toggle("open");
  if (o) o.style.display = d.classList.contains("open") ? "block" : "none";
}
function closeDrw() {
  const d = document.getElementById("drw");
  const o = document.getElementById("drwOverlay");
  if (d) d.classList.remove("open");
  if (o) o.style.display = "none";
}

// ── Auth Modals ───────────────────────────────────────────
function openAuth(t) { switchAuth(t); document.getElementById("ovlAuth").classList.add("on"); }
function closeAuth() { document.getElementById("ovlAuth").classList.remove("on"); }
function switchAuth(t) {
  const fl = document.getElementById("fLogin");
  const fs = document.getElementById("fSignup");
  const tl = document.getElementById("tLogin");
  const ts = document.getElementById("tSignup");
  if (fl) fl.style.display = t === "login" ? "flex" : "none";
  if (fs) fs.style.display = t === "signup" ? "flex" : "none";
  if (tl) tl.classList.toggle("on", t === "login");
  if (ts) ts.classList.toggle("on", t === "signup");
}

async function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const pass  = document.getElementById("loginPass").value;
  if (!email || !pass) { toast("Preencha todos os campos"); return; }
  if (!sb) { toast("Sem conexao. Tente pelo site online."); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
  if (error) { toast("E-mail ou senha incorretos"); return; }
  currentUser = data.user;
  updateNav();
  closeAuth();
  toast("Bem-vindo(a)!");
}

async function doSignup() {
  const name  = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const pass  = document.getElementById("signupPass").value;
  const pass2 = document.getElementById("signupPass2").value;
  if (!name || !email || !pass || !pass2) { toast("Preencha todos os campos"); return; }
  if (pass !== pass2) { toast("Senhas não coincidem"); return; }
  const { data, error } = await sb.auth.signUp({ email: email, password: pass, options: { data: { name: name } } });
  if (error) { toast(error.message); return; }
  currentUser = data.user;
  updateNav();
  closeAuth();
  toast("Conta criada! Bem-vindo(a), " + name + "!");
}

// ── Cart ──────────────────────────────────────────────────
function openCart() { renderCart(); document.getElementById("ovlCart").classList.add("on"); }
function closeCart() { document.getElementById("ovlCart").classList.remove("on"); }
function saveCart() {
  localStorage.setItem("rucart", JSON.stringify(cart));
  const b = document.getElementById("badge");
  if (b) b.textContent = cart.length;
}
function renderCart() {
  const b = document.getElementById("cartBody");
  if (!b) return;
  if (!currentUser) {
    b.innerHTML = "<div style='text-align:center;padding:1.8rem'>"
      + "<p style='color:#555;font-size:.78rem;margin-bottom:1rem'>Faça login para comprar.</p>"
      + "<button class='obtn' onclick='closeCart();openAuth("login")'>Entrar</button></div>";
    return;
  }
  if (!cart.length) {
    b.innerHTML = "<div style='text-align:center;padding:2.5rem;color:#444'><p style='font-size:.82rem'>Sacola vazia</p></div>";
    return;
  }
  const total = cart.reduce(function(a, i) { return a + parseFloat(i.price); }, 0);
  let rows = "";
  cart.forEach(function(i) {
    rows += "<div style='background:#0d0d0d;padding:.85rem 1rem;display:flex;align-items:center;gap:12px'>"
      + "<div style='flex:1'><div style='font-size:.79rem;font-weight:500'>" + i.beat + "</div>"
      + "<div style='font-size:.65rem;color:#555'>Licença " + i.lic + "</div></div>"
      + "<div style='font-family:Cinzel,serif;font-size:.85rem;color:#c4a35a'>" + i.label + "</div>"
      + "<button onclick='rmCart(" + i.id + ")' style='background:none;border:none;color:#555;cursor:pointer;padding:2px 6px'>✕</button></div>";
  });
  b.innerHTML = "<div style='display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,0.05);margin-bottom:1.3rem'>" + rows + "</div>"
    + "<div style='display:flex;justify-content:space-between;padding:.9rem 0;border-top:1px solid rgba(255,255,255,0.08);margin-bottom:1.3rem'>"
    + "<span style='font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#555'>Total</span>"
    + "<strong style='font-family:Cinzel,serif;font-size:1.1rem;color:#c4a35a'>R$" + total.toFixed(2).replace(".", ",") + "</strong></div>"
    + "<button class='gbtn' onclick='goCheckout()'>Finalizar Compra</button>";
}
function rmCart(id) {
  cart = cart.filter(function(i) { return i.id !== id; });
  saveCart();
  renderCart();
}
function goCheckout() {
  localStorage.setItem("rucheckout", JSON.stringify(cart));
  closeCart();
  window.location.href = "pagamento.html";
}

// ── Chat ──────────────────────────────────────────────────
function toggleChat() { document.getElementById("chatWin").classList.toggle("on"); }
const chatResps = [
  "Para licenças: Básica é pessoal, Premium para redes, Exclusiva tem direitos completos.",
  "Pagamento por PIX, cartão ou boleto.",
  "Stems disponíveis apenas na Licença Exclusiva.",
  "Para parcerias, fala no Instagram @rucinni!"
];
let chatIdx = 0;
function sendMsg() {
  const inp = document.getElementById("cinput");
  const m = inp.value.trim();
  if (!m) return;
  const msgs = document.getElementById("cwmsgs");
  msgs.innerHTML += "<div class='cm usr'>" + m + "</div>";
  inp.value = "";
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(function() {
    msgs.innerHTML += "<div class='cm bot'>" + chatResps[chatIdx++ % chatResps.length] + "</div>";
    msgs.scrollTop = msgs.scrollHeight;
  }, 700);
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById("toastEl");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(function() { t.classList.remove("on"); }, 2600);
}

window.addEventListener("load", initAuth);
</script>
